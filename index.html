<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIT Smart Campus</title>
    <style>
      #boot-status {
        max-width: 640px;
        margin: 15vh auto;
        padding: 24px;
        color: #233247;
        font: 15px/1.6 "Segoe UI", sans-serif;
      }
      #boot-status[hidden] { display: none; }
      #boot-status a { color: #17668f; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <p id="boot-status" role="status">Loading the campus application…</p>
    <script type="module">
      const status = document.querySelector("#boot-status");

      async function loadPublishedApp() {
        const manifestUrls = [
          new URL("./.vite/manifest.json", location.href),
          new URL("./dist/.vite/manifest.json", location.href),
        ];
        let manifestUrl;
        let manifest;

        for (const candidate of manifestUrls) {
          const response = await fetch(candidate);
          if (response.ok) {
            try {
              const candidateManifest = await response.json();
              if (candidateManifest && typeof candidateManifest === "object") {
                manifestUrl = candidate;
                manifest = candidateManifest;
                break;
              }
            } catch {
              continue;
            }
          }
        }

        if (!manifest || !manifestUrl) {
          throw new Error("The published application bundle is missing. Refresh in a moment or contact the site maintainer.");
        }

        const entry = Object.values(manifest).find((item) => item.isEntry && item.src === "main.jsx");
        if (!entry) {
          throw new Error("The published application entry could not be found.");
        }

        const outputRoot = new URL("../", manifestUrl);
        for (const stylesheet of entry.css || []) {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = new URL(stylesheet, outputRoot);
          document.head.append(link);
        }

        const script = document.createElement("script");
        script.type = "module";
        script.src = new URL(entry.file, outputRoot);
        script.onerror = () => {
          status.textContent = "The campus application bundle could not be loaded. Refresh the page or contact the site maintainer.";
          status.hidden = false;
        };
        document.head.append(script);
        status.hidden = true;
      }

      const usePublishedBuild =
        location.hostname.endsWith(".github.io") ||
        new URLSearchParams(location.search).get("mode") === "static";

      if (usePublishedBuild) {
        loadPublishedApp().catch((error) => {
          console.error("Could not start the published campus application.", error);
          status.textContent = error.message;
          status.hidden = false;
        });
      } else {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/main.jsx";
        script.onerror = () => {
          status.textContent = "The campus app did not start. Check the development server and refresh.";
          status.hidden = false;
        };
        document.head.append(script);
        status.hidden = true;
      }
    </script>
  </body>
</html>
