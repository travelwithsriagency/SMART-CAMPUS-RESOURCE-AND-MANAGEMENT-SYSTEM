name: Deploy campus app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_source: ${{ steps.pages-source-check.outputs.build_type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check GitHub Pages source
        id: pages-source-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          build_type="$(jq -r '.build_type // "unset"' <<< "$config")"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          if [[ "$build_type" == "workflow" ]]; then
            echo "GitHub Pages will deploy the built artifact."
          elif [[ "$build_type" == "legacy" ]]; then
            echo "::warning title=Legacy GitHub Pages source::The branch-published HTML bundle will serve the site. Switch Pages to GitHub Actions to deploy the Actions artifact."
          else
            echo "::error title=GitHub Pages is not enabled::Enable Pages for this repository before deploying."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase web app
        run: cp .env.example .env

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: needs.build.outputs.pages_source == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
